<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f3d3e">
<title>Meekijken als monteur · OfficeRoute</title>
<style>
  @font-face{font-family:'Jost';font-style:normal;font-weight:100 900;font-display:swap;src:url("{{ url_for('static', filename='fonts/jost-latin.woff2') }}") format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122}
  :root{--gold:#b88a44}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:'Jost',Arial,sans-serif;background:#f3efe8;color:#16302d;-webkit-font-smoothing:antialiased;
       display:flex;align-items:center;justify-content:center;overscroll-behavior:none;min-height:100vh;min-height:100svh}
  .phone{width:100%;height:100vh;height:100svh;overflow:hidden;display:flex;flex-direction:column;
         background:linear-gradient(170deg,#0f3d3e,#15595a 60%,#0d3334);color:#fff}
  @media (min-width:600px) and (min-height:760px){ body{background:#aeb9b2} .phone{width:412px;height:96dvh;max-height:900px;border-radius:46px;box-shadow:0 22px 60px rgba(0,0,0,.32)} }
  .hd{padding:calc(env(safe-area-inset-top) + 26px) 22px 4px;flex-shrink:0}
  .hd .top{display:flex;justify-content:space-between;align-items:center}
  .hd .brand{font-weight:600;letter-spacing:.16em;text-transform:uppercase;font-size:12.5px;color:#bcdcd2}
  .hd .out{color:#bcdcd2;font-size:13px;text-decoration:none}
  .hd h1{font-size:23px;margin:12px 0 4px;font-weight:700}
  .hd p{margin:0;color:#bcdcd2;font-size:13.5px;line-height:1.45}
  .list{flex:1;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);overflow:auto}
  .mt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16);
      border-radius:15px;padding:13px 14px;margin-bottom:10px;color:#fff;font:inherit;cursor:pointer;transition:.15s}
  .mt:hover{background:rgba(255,255,255,.13)}
  .mt.sel{border-color:var(--gold);background:rgba(184,138,68,.18)}
  .mt .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;border:2px solid rgba(255,255,255,.5)}
  .mt .nm{font-weight:700;font-size:16px;display:block}
  .mt .sub{font-size:12.5px;color:#bcdcd2;display:block;margin-top:2px}
  .mt .chev{margin-left:auto;font-size:20px;color:#8fb3aa}
  .empty{color:#bcdcd2;font-size:14px;padding:10px 4px}
</style>
</head>
<body>
<div class="phone">
  <div class="hd">
    <div class="top"><span class="brand">OfficeRoute</span><a class="out" href="{{ url_for('planning.logout') }}">Uitloggen</a></div>
    <h1>Meekijken als monteur</h1>
    <p>Kies een monteur. Je ziet zijn app zoals hij hem ziet, met zijn route van vandaag. Alleen kijken: je kunt niets afronden, versturen of indienen.</p>
  </div>
  <form method="post" class="list">
    {% for m in monteurs %}
    <button class="mt {{ 'sel' if current==m.id }}" type="submit" name="monteur_id" value="{{ m.id }}">
      <span class="av" style="background:{{ m.color or '#15595a' }}">{{ m.name[:1]|upper }}</span>
      <span><span class="nm">{{ m.name }}</span>
        <span class="sub">{% if m.stops %}{{ m.stops }} stop{{ 's' if m.stops != 1 }} vandaag{% if m.done %}, {{ m.done }} afgerond{% endif %}{% else %}Vandaag geen route{% endif %}</span></span>
      <span class="chev">›</span>
    </button>
    {% else %}
    <div class="empty">Er zijn nog geen actieve monteurs.</div>
    {% endfor %}
  </form>
</div>
</body>
</html>
